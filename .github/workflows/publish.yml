name: Publish

# CI runs on every push to main and on PRs.
# Release: create a GitHub Release (with a vX.Y.Z tag) to publish to npm.
# The tag MUST match package.json version; the workflow verifies it.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write # read the release, create refs if needed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event points at the tag; check out exactly that ref.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to npm
    needs: verify
    # Only release events publish; plain pushes and PRs stop at verify.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json, commit, and re-tag."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attach release notes to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Mark the release with the published version for quick scanning.
          gh release edit "${{ github.event.release.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$(gh release view "${{ github.event.release.tag_name }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)

          Published \`bytebase-mcp@$(node -p 'require("./package.json").version')\` to npm. https://www.npmjs.com/package/bytebase-mcp"
