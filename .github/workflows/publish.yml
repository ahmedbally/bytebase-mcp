name: Publish

# CI runs on every push to main and on PRs.
# Release: create a GitHub Release (with a vX.Y.Z tag) to publish to npm.
# Publishing uses npm Trusted Publishers (OIDC) — no NPM_TOKEN secret:
#   1. npmjs.com → bytebase-mcp → Settings → Trusted Publisher
#   2. Add: GitHub / ahmedbally / bytebase-mcp / publish.yml (no environment)
# The tag MUST match package.json version; the workflow verifies it.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write # read the release, edit release notes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release event points at the tag; check out exactly that ref.
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  publish:
    name: Publish to npm (Trusted Publisher)
    needs: verify
    # Only release events publish; plain pushes and PRs stop at verify.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # OIDC federation for npm Trusted Publishers + release-notes editing.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      # Node 24 bundles npm 11, which speaks the Trusted Publisher OIDC flow.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # .gitignore excludes dist/ — the tarball only contains what is built
      # in THIS job, so build before publishing.
      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p 'require("./package.json").version')"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag $TAG_VERSION does not match package.json version $PKG_VERSION. Bump package.json, commit, and re-release."
            exit 1
          fi

      # No token: npm exchanges the GitHub OIDC claim for publish rights
      # against the Trusted Publisher configured on npmjs.com.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Attach published version to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          EXISTING="$(gh release view "${{ github.event.release.tag_name }}" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          gh release edit "${{ github.event.release.tag_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "$EXISTING

          ---
          Published \`bytebase-mcp@${VERSION}\` to npm with provenance: https://www.npmjs.com/package/bytebase-mcp"
